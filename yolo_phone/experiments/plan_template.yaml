# 训练计划模板：复制到 experiments/<新实验目录>/plan.yaml 后修改。
# 超参只写在本文件；train.py 不另设默认值。路径相对 yolo_phone/。
# 选模只看 val；test 只做最终回归对照，不能用来选轮次或调阈值。
# 下面的 train 参数与 official_targeted_round2_20261021（官方起点、80 轮）一致。

name: <新运行名，例如 multiview_round3_20261120_yolo11n>
data: data/selftrain_multiview_targeted_round2_20261021/data.yaml
model: ../yolo11n.pt          # 官方起点；继续训练可改为 runs/<运行>/weights/best.pt
model_sha256: 0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1
notes: <这次实验要验证什么>

train:                        # 原样传给 Ultralytics model.train（imgsz 固定取 config）
  epochs: 80
  patience: 0
  batch: 16
  device: mps
  workers: 2
  cache: false
  pretrained: true
  optimizer: AdamW
  lr0: 0.001667
  momentum: 0.9
  warmup_bias_lr: 0.0
  seed: 0
  deterministic: true
  close_mosaic: 10
  save_period: 5
